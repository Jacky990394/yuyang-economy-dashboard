<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實體經濟與環境觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f1115; color: #e2e8f0; font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif; }
        .card { background-color: #1a1d24; border-radius: 12px; border: 1px solid #2d333b; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-color: #4b5563; }
        .neutral-badge { background-color: #2d333b; color: #e2e8f0; border: 1px solid #475569; }
        
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; padding: 20px; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #modal-content { background: #1a1d24; width: 100%; max-width: 900px; border-radius: 12px; padding: 30px; position: relative; border: 1px solid #475569; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 32px; cursor: pointer; color: #94a3b8; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto mb-10 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-wider">實體經濟與環境觀測站</h1>
        <p class="text-gray-400 text-lg mb-2">客觀數據自動化追蹤，提供產業與環境趨勢研判之基礎參考</p>
        <p class="text-sm text-yellow-500">💡 點擊任何卡片可放大查看詳細走勢與指標說明</p>
    </div>

    <div id="grid-container" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="modal">
        <div id="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pr-8">
                <h2 id="modal-title" class="text-2xl font-bold mb-2 md:mb-0">指標詳情</h2>
                <span id="modal-badge" class="px-4 py-1.5 text-md font-bold rounded-full neutral-badge">數值</span>
            </div>
            <p id="modal-desc" class="text-sm text-gray-300 mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700 leading-relaxed"></p>
            <div class="relative h-80 md:h-96 w-full"><canvas id="modalChart"></canvas></div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🟢🟢🟢 總司令部：未來新增指標，只要在這裡「複製貼上一行」即可 🟢🟢🟢
        // =========================================================================
       const indicatorRegistry = [
            // 【第一排：宏觀與能源】
            { id: 'brent', title: '指標一：布蘭特原油 (美元/桶)', file: 'brent_data.json', key: 'current_price', color: '#14B8A6', dynamicY: false, desc: '<strong>資料來源：</strong>Yahoo Finance<br><strong>意義：</strong>全球通膨源頭與大宗物資之先期觀測指標。' },
            { id: 'gasoline', title: '指標二：95 無鉛汽油 (元/公升)', file: 'gasoline_data.json', key: 'current_price', color: '#DC2626', dynamicY: false, desc: '<strong>資料來源：</strong>台灣中油<br><strong>意義：</strong>實體物流運輸與營造機具變動成本之觀測基準。' },
            { id: 'gold', title: '指標三：實體黃金 (新台幣/台兩)', file: 'gold_data.json', key: 'current_price', color: '#FBBF24', dynamicY: true, desc: '<strong>資料來源：</strong>台灣銀行<br><strong>意義：</strong>反映台灣民間最真實之終端避險資產價格。' },
            
            // 【第二排：營建與未來供給】
            { id: 'const', title: '指標四：營造工程物價 (指數)', file: 'construction_data.json', key: 'average_cost_index', color: '#A855F7', dynamicY: false, desc: '<strong>資料來源：</strong>主計總處<br><strong>意義：</strong>營建發包成本基準。' },
            { id: 'license', title: '指標五：使用執照核發 (指數)', file: 'license_data.json', key: 'current_value', color: '#10B981', dynamicY: false, desc: '<strong>資料來源：</strong>內政部<br><strong>意義：</strong>全台當期核發建築物使用執照之趨勢。' },
            { id: 'floor', title: '指標六：使照樓地板面積 (萬㎡)', file: 'floor_area_data.json', key: 'current_value', color: '#22D3EE', dynamicY: true, desc: '<strong>資料來源：</strong>內政部<br><strong>意義：</strong>反映完工交屋的實體空間量體，預測修繕裝潢商機。' },

            // 【第三排：房市需求與環境基礎】
            { id: 'housing', title: '指標七：房屋買賣移轉 (棟)', file: 'housing_transfer_data.json', key: 'current_value', color: '#6366F1', dynamicY: true, desc: '<strong>資料來源：</strong>內政部<br><strong>意義：</strong>房市熱度溫度計，牽動防水漏水工程需求。' },
            { id: 'power', title: '指標八：電網備轉容量 (%)', file: 'power_data.json', key: 'average_reserve_rate', color: '#D97706', dynamicY: false, desc: '<strong>資料來源：</strong>台電<br><strong>意義：</strong>電網供電充裕度指標。' },
            { id: 'water', title: '指標九：重點水庫綜合蓄水 (%)', file: 'water_data.json', key: 'average_storage_rate', color: '#3B82F6', dynamicY: false, isWater: true, desc: '<strong>資料來源：</strong>水利署<br><strong>意義：</strong>包含寶山第二、石門、曾文等全台重點水庫之平均蓄水率。' },

            // 【第四排：民生通膨與區域水情】
            { id: 'boba', title: '指標十：複合珍奶指數 (點)', file: 'boba_data.json', key: 'current_index', color: '#F97316', dynamicY: false, desc: '<strong>資料來源：</strong>主計總處+民間<br><strong>意義：</strong>真實通膨觀測指標。' },
            { id: 'lottery', title: '指標十一：彩券銷售指數 (點)', file: 'lottery_data.json', key: 'current_value', color: '#EC4899', dynamicY: false, desc: '<strong>資料來源：</strong>財政部<br><strong>意義：</strong>民間消費力與基層通膨焦慮之反週期指標。' },
            { id: 'medical', title: '指標十二：醫藥保健指數 (點)', file: 'medical_data.json', key: 'current_value', color: '#F43F5E', dynamicY: false, desc: '<strong>資料來源：</strong>主計總處<br><strong>意義：</strong>追蹤掛號費與自費醫療之真實通膨。' },

            // 【第五排：北中南細部分析】
            { id: 'water_n', title: '指標十三：北部民生水庫 (%)', file: 'water_north_data.json', key: 'current_value', color: '#60A5FA', dynamicY: false, isWater: true, desc: '<strong>資料來源：</strong>水利署<br><strong>意義：</strong>翡翠、石門等北部主力民生水庫蓄水率。' },
            { id: 'water_c', title: '指標十四：中部民生水庫 (%)', file: 'water_central_data.json', key: 'current_value', color: '#34D399', dynamicY: false, isWater: true, desc: '<strong>資料來源：</strong>水利署<br><strong>意義：</strong>鯉魚潭、德基等中部主力民生水庫蓄水率。' },
            { id: 'water_s', title: '指標十五：南部民生水庫 (%)', file: 'water_south_data.json', key: 'current_value', color: '#F87171', dynamicY: false, isWater: true, desc: '<strong>資料來源：</strong>水利署<br><strong>意義：</strong>曾文、南化等南部主力民生水庫蓄水率。' },
            
            // 【第六排：金融資金成本】
            { id: 'deposit', title: '指標十六：一年期定存利率 (%)', file: 'deposit_rate_data.json', key: 'current_value', color: '#8B5CF6', dynamicY: false, desc: '<strong>資料來源：</strong>台灣銀行/央行<br><strong>意義：</strong>反映國內資金成本與無風險利率基準。升息代表資金緊縮，降息代表資金寬鬆，為總體經濟與房地產之核心地心引力。' }
        ];
        // =========================================================================

        const chartDataStore = {};
        let modalChartInstance = null;
        const container = document.getElementById('grid-container');

        // 自動生成卡片
        indicatorRegistry.forEach(ind => {
            const cardHTML = `
                <div class="card p-5" onclick="openModal('${ind.id}', '${ind.title}')">
                    <div class="flex flex-col justify-between items-start mb-4">
                        <h2 class="text-lg font-semibold border-l-4 pl-3 mb-2" style="border-color: ${ind.color}">${ind.title}</h2>
                        <span id="${ind.id}-badge" class="px-3 py-1 text-sm font-bold rounded-full neutral-badge">讀取中...</span>
                    </div>
                    <div class="relative h-48 w-full"><canvas id="${ind.id}-chart"></canvas></div>
                    <div class="mt-4 text-xs text-gray-500 text-right" id="${ind.id}-time">最後更新：讀取中...</div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });

        const chartOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#888' } }, x: { grid: { display: false }, ticks: { color: '#888' } } } };

        // 自動抓取資料
        indicatorRegistry.forEach(ind => {
            fetch(ind.file).then(r => r.ok ? r.json() : Promise.reject("未找到")).then(data => {
                document.getElementById(`${ind.id}-time`).innerText = "更新：" + data.update_time;
                document.getElementById(`${ind.id}-badge`).innerText = data[ind.key];
                
                let opts = JSON.parse(JSON.stringify(chartOptions));
                if (ind.isWater) opts.scales.y.max = 100;
                if (ind.dynamicY) delete opts.scales.y.min;

                let config = { type: 'line', data: { labels: data.history_labels, datasets: [{ data: data.history_data, borderColor: ind.color, backgroundColor: ind.color + '25', borderWidth: 3, fill: true, tension: 0.4, pointRadius: 1 }] }, options: opts };
                
                new Chart(document.getElementById(`${ind.id}-chart`).getContext('2d'), config);
                chartDataStore[ind.id] = { config, desc: ind.desc, badgeStr: data[ind.key] };
            }).catch(e => { document.getElementById(`${ind.id}-badge`).innerText = "⚠️ 讀取失敗"; });
        });

        // 放大視窗邏輯
        function openModal(id, title) {
            const store = chartDataStore[id];
            if (!store) return;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-badge').innerText = store.badgeStr;
            document.getElementById('modal-desc').innerHTML = store.desc;
            
            if (modalChartInstance) modalChartInstance.destroy();
            let modalConfig = JSON.parse(JSON.stringify(store.config));
            modalConfig.data.datasets[0].pointRadius = 4; 
            modalConfig.data.datasets[0].borderWidth = 4;
            modalChartInstance = new Chart(document.getElementById('modalChart').getContext('2d'), modalConfig);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    </script>
</body>
</html>
