name: 每日自動更新水情與經濟指數

on:
  schedule:
    # 每天台灣時間早上 8 點執行 (UTC 時間 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 留一個按鈕讓您可以隨時手動點擊測試

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 進入雲端倉庫
      uses: actions/checkout@v3

    - name: 2. 準備 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 3. 安裝網路抓取工具
      run: |
        pip install requests
        pip install urllib3
        pip install beautifulsoup4

    - name: 4. 派機器人去抓資料！(水、電、營造全開)
      run: |
        python update_water.py
        python update_power.py
        python update_construction.py
        python update_license.py
        python update_boba.py
        python update_gasoline.py
        python update_brent.py
        python update_lottery.py
        python update_gold.py
        python update_medical.py
        python update_housing_transfer.py

    - name: 5. 將最新數據寫回雲端展示窗
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "🤖 昱揚機器人：自動更新三大指數" || exit 0
        git push
